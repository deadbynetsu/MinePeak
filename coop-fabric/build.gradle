plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            programArgs '--username', (System.getenv('SKYCRAFT_USERNAME') ?: 'Jogador')
            if (System.getenv('SKYCRAFT_UUID')) programArgs '--uuid', System.getenv('SKYCRAFT_UUID')
            vmArgs '--enable-native-access=ALL-UNNAMED', '-Dskycraft.startHidden=true', '-Dskycraft.quitWithSkyrim=true', '-Dskycraft.link=Local\\PeakCraftCoop_v1'
        }
    }
    mods { 'peakcraft_profile' { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    implementation files('../binarios/peakcraftcoop-fabric.jar')
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
jar { from('../LICENSE') }
