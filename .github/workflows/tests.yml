name: Testes da ponte

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-tests:
    name: Testes .NET / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Obter fontes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar SDK .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Testar fome/vida, regioes de colisao e multiplayer
        shell: pwsh
        run: ./Testar.ps1
